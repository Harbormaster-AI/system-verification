version: 2.1


references:

working_directory: &working_directory
  /home/circleci/gitRoot/

repo_cache_key: &repo_cache_key
  v1-repo-{{ .Branch }}-{{ .Revision }}

# Step to restore repository from cache
restore_repo: &restore_repo
  restore_cache:
    key: *repo_cache_key

save_repo: &save_repo
  save_cache:
    key: *repo_cache_key
    paths:
        - *working_directory
  
base_terraform_image: &base_terraform_image
  hashicorp/terraform:0.11.14
  
terraform_config: &terraform_config
  docker:
    - image: *base_terraform_image
      environment:
          TERRAFORM_DIR: terraform
  working_directory: *working_directory
  environment:
    BASH_ENV: /root/.bashrc

terraform_init: &terraform_init
  run:
    name: terraform init
    command: |
      cd /home/circleci/gitRoot/terraform
      terraform init

jobs: 

  # core job
  build_test_project:

    # assign the working directory
    working_directory: *working_directory
        
    # run the steps with Docker as the primary container
    # job commands run in this container
    # CircleCI Golang
    # db image
    docker:
      - image: circleci/golang:1.22-alpine      - image: mysql:8.0
 



    # env var assignments
        environment:
          MYSQL_ROOT_PASSWORD: $dbPassword
          MYSQL_DATABASE: $dbName
          MYSQL_USER: $dbUserName
          MYSQL_PASSWORD: $dbPassword
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
            TEST_RESULTS: /tmp/test-results # path to where test results will be saved    

    # steps the core build test job
    steps:

      # check out source code to working directory
      - checkout
      # changing ownership
      - run:
          name: Assigning vars for Git
          command: export EMAIL=circleci@circleci.com && export GIT_AUTHOR_NAME=CircleCi && export GIT_COMMITTER_NAME=CircleCi

      - run:
          name: Initializing
          command: echo initializaing...
                   

      - run: go get github.com/gorilla/mux  
      - run: go get -u gorm.io/gorm 
      - run: go get -u gorm.io/driver/mysql 
      - run: go get github.com/joho/godotenv 
      - run:
          name: Building with testing
          command: echo building with testing...

      - run: go mod init WealthManagementongolang 
      - run: go mod tidy 
      - run: go build 
      - run: go test WealthManagementongolang/internal/test 
      # cache the entire project 
      - *save_repo
      # Upload test results for display in Test Summary:
      # https://circleci.com/docs/2.0/collect-test-data/
      - store_test_results:
          path: ~/test-results
      # Upload test summary for display in Artifacts:
      # https://circleci.com/docs/2.0/artifacts/
      - store_artifacts:
          path: ~/test-results/junit


  docker_build:
    # assign the working directory
    working_directory: *working_directory

    docker: # run the steps with Docker, this image is not used and therefore ignored
      - image: circleci/python:3.7  
      
    steps:
      - *restore_repo
      - setup_remote_docker
      - run:
          name: creating docker image..considering using env vars DOCKER_USER and DOCKER_PASS
          command: |
            docker login --username tylertravismya --password 69Cutlass docker.io
            docker build -t theharbormaster/WealthManagement-on-golang:latest -f Dockerfile .
            docker push theharbormaster/WealthManagement-on-golang:latest

  terraform:
    <<: *terraform_config
    steps:
      - *restore_repo
      - *terraform_init
      - add_ssh_keys: # fingerprint is returned when the private SSH key is applied to this CircleCI project
          fingerprints:
            - ""
      - run:
          name: terraform plan
          command: |
            cd /home/circleci/gitRoot/terraform
            chmod 777 terraform.sh
            ./terraform.sh
# a workflow to build out the environment
workflows:
  build_test_deploy_workflow:
    jobs:
      - build_test_project:
          filters:
            tags:
              only: 
      - docker_build:
          requires:
            - build_test_project
      - terraform:
          requires:
            - docker_build
