
default: &default
    adapter: <%= {
    "postgres"   => "postgresql",
    "mysql"      => "mysql2",
    "sqlite"     => "sqlite3",
    "sqlserver"  => "sqlserver",
    "oracle"     => "oracle_enhanced",
    "db2"        => "ibm_db"
    }.fetch(ENV.fetch("DB_TYPE", "mysql")) %>
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: <%= Rails.configuration.database_name %>_development
  username: <%= Rails.configuration.database_username %>
  password: <%= Rails.configuration.database_password %>
  host: <%= Rails.configuration.database_host %>
  port: <%= Rails.configuration.database_port %>

test:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "harbormaster") %>
    username: <%= ENV.fetch("DB_USER_NAME", "root") %>
    password: <%= ENV.fetch("DB_PASSWORD", "root") %>
    host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
    port: <%= ENV.fetch("DB_PORT", "8080") %>

harbormaster_test:
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("PGHOST", "127.0.0.1") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  database: <%= ENV.fetch("PGDATABASE", "rails_test") %>
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  password: <%= ENV.fetch("PGPASSWORD", "postgres") %>

production:
  <<: *default
  database: <%= Rails.configuration.database_name %>production
  username: <%= Rails.configuration.database_username %>
  password: <%= Rails.configuration.database_password %>
  host: <%= Rails.configuration.database_host %>
  port: <%= Rails.configuration.database_port %>