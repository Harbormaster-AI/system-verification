#------------------------------------------------------------------------------
# django root related
#------------------------------------------------------------------------------
manage.py=.demo
requirements.txt=.demo
admin.py=.demo
apps.py=.demo
appUrls.py=.demo
setup.py=.demo
README.rst=.demo
LICENSE=.demo
Dockerfile=.demo

#------------------------------------------------------------------------------
# django mainsite related
#------------------------------------------------------------------------------
settings.py=.demo.mainsite
wsgi.py=.demo.mainsite

#------------------------------------------------------------------------------
# django app related
#------------------------------------------------------------------------------
__classes__.py=.demo.models
__classes__Delegate.py=.demo.delegates
__classes__Test.py=.demo.tests
__classes__View.py=.demo.views
__classes__Urls.py=.demo.urls
__enums__.py=.demo.models
Exceptions.py=.demo.exceptions
empty.doc=.demo.docs

#------------------------------------------------------------------------------
# django test related
#------------------------------------------------------------------------------
pytest.ini=.demo.tests
 
# django mainsite and app related...all django directories need an __init__.py to treat contents as Python
__init__.py=.demo.mainsite,.demo.models,.demo.delegates,.demo.tests,.demo.views,.demo.urls,.demo.exceptions

exclusions=mappings.properties,options.json,blueprint.json