name: Delivery Verification

on:

  workflow_call:

    inputs:

      runner:
        description: GitHub runner label
        required: false
        default: self-hosted
        type: string

      resultUrl:
        description: URL to post verification results
        required: false
        default: "http://localhost:3000"
        type: string

      actionToCall:
        description: action to call when posting to URL
        required: false
        default: "updateVerificationProgress"
        type: string

      branch:
        description: Branch to checkout
        required: false
        default: ""
        type: string

      gitHubToken:
        description: Token to securely access APIs and other capabilities on behalf of the caller
        required: false
        default: ""
        type: string

      certificationIdentifier:
        required: true
        type: string

      appName:
        required: true
        type: string

      dockerHost:
        description: Docker registry host
        required: false
        default: ""
        type: string

      dockerOrg:
        description: Docker organization
        required: false
        default: ""
        type: string

      dockerRepository:
        description: Docker repository
        required: false
        default: ""
        type: string

      dockerUsername:
        description: Docker username
        required: false
        default: ""
        type: string

      dockerPassword:
        description: Docker password
        required: false
        default: ""
        type: string

      dockerTag:
        description: Docker image tag
        required: false
        default: latest
        type: string

      # Which stack is being delivered. Drives ports, health checks, and DB sidecars.
      # spring | go | angular | django | rails | apollo (aliases like springboot/golang accepted)
      technology:
        description: Technology being verified
        required: true
        type: string

      saveDockerImage:
        description: Save Docker image as artifact when TRUE
        required: false
        default: "FALSE"
        type: string

      deployToCloud:
        description: When false (or non Spring/Go), delivery may delete the verification branch at the end
        required: false
        default: true
        type: boolean

env:
  RESULT_URL:                   ${{ inputs.resultUrl }}
  ACTION_TO_CALL:               ${{ inputs.actionToCall }}
  CERTIFICATION_IDENTIFIER:     ${{ inputs.certificationIdentifier }}
  APP_NAME:                     ${{ inputs.appName }}

  REGISTRY_HOST:                ${{ inputs.dockerHost }}
  REGISTRY_ORG:                 ${{ inputs.dockerOrg }}
  REGISTRY_REPOSITORY:          ${{ inputs.dockerRepository }}
  REGISTRY_USERNAME:            ${{ inputs.dockerUsername }}
  REGISTRY_PASSWORD:            ${{ inputs.dockerPassword }}
  REGISTRY_TAG:                 ${{ inputs.dockerTag }}

jobs:

  delivery-verification:

    runs-on: ${{ inputs.runner }}

    services:

      mysql:

        image: mysql:8.4

        env:

          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: harbormaster

        ports:

          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      ###########################################################################
      #   Checkout source
      ###########################################################################

      - name: Checkout Source
        uses: actions/checkout@v4

        with:
          ref: ${{ inputs.branch }}

      ###########################################################################
      # Always use report.sh from the verification workflow commit (not app branch)
      ###########################################################################

      - name: Overlay verification report.sh
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .hm-verification-overlay
          sparse-checkout: |
            .github/actions/common
          sparse-checkout-cone-mode: false

      - name: Install verification report.sh
        shell: bash
        run: |
          mkdir -p .github/actions/common
          cp -f .hm-verification-overlay/.github/actions/common/report.sh .github/actions/common/report.sh
          chmod +x .github/actions/common/report.sh

      ###########################################################################
      #   Announce start of delivery verification
      ###########################################################################

      - name: Delivery Verification Starting

        shell: bash

        run: |
          
          source .github/actions/common/report.sh
          
          post_pass \
                        "DELIVERY" \
                        "STARTING_DELIVERY" \
                        0 \
                        "Delivery verification starting..." \
                        "" 

      ###########################################################################
      #   Download pre-built artifact
      ###########################################################################

      - uses: actions/download-artifact@v4
        with:
          name: packaged-application

      ###############################################################################
      # Django: verify packaged application (same as django-delivery-verification.yml)
      ###############################################################################

      - name: Verify Django Application Artifact
        if: ${{ contains(fromJSON('["django"]'), inputs.technology) }}

        shell: bash

        run: |
          source .github/actions/common/report.sh

          APP_DIRECTORY="${APP_NAME}"

          if [ ! -d "${APP_DIRECTORY}" ]; then
              post_fail \
                  "DELIVERY" \
                  "VERIFY_ARTIFACT" \
                  0 \
                  "Django application artifact directory not found." \
                  "VERIFY_ARTIFACT: ${APP_DIRECTORY}"
              post_terminate_delivery
          fi

          if [ ! -f "${APP_DIRECTORY}/manage.py" ]; then
              post_fail \
                  "DELIVERY" \
                  "VERIFY_ARTIFACT" \
                  0 \
                  "Django application artifact does not contain manage.py." \
                  "VERIFY_ARTIFACT: ${APP_DIRECTORY}/manage.py"
              post_terminate_delivery
          fi

          post_pass \
              "DELIVERY" \
              "VERIFY_ARTIFACT" \
              5 \
              "Django application artifact located." \
              "VERIFY_ARTIFACT: ${APP_DIRECTORY}"

      ###############################################################################
      # Apollo: verify packaged application (same as apollo-delivery-verification.yml)
      ###############################################################################

      - name: Verify Apollo Build Artifact
        if: ${{ contains(fromJSON('["ApolloGraphQL","Apollo","apollo","apollographql"]'), inputs.technology) }}

        shell: bash

        run: |
          source .github/actions/common/report.sh

          SCORE=0

          if [ -d "dist" ]; then
              SCORE=$((SCORE + 3))
              post_pass \
                  "DELIVERY" \
                  "VERIFY_DIST" \
                  3 \
                  "Compiled Apollo application found." \
                  "VERIFY_DIST: dist/"
          else
              post_fail \
                  "DELIVERY" \
                  "VERIFY_DIST" \
                  0 \
                  "Compiled Apollo application not found." \
                  "VERIFY_DIST: dist/ missing."
              post_terminate_delivery
          fi

          if [ -d "node_modules" ]; then
              SCORE=$((SCORE + 3))
              post_pass \
                  "DELIVERY" \
                  "VERIFY_NODE_MODULES" \
                  3 \
                  "Node dependencies found in build artifact." \
                  "VERIFY_NODE_MODULES: node_modules/"
          else
              post_fail \
                  "DELIVERY" \
                  "VERIFY_NODE_MODULES" \
                  0 \
                  "Node dependencies not found in build artifact." \
                  "VERIFY_NODE_MODULES: node_modules/ missing."
              post_terminate_delivery
          fi

          if [ -f "package.json" ]; then
              SCORE=$((SCORE + 2))
              post_pass \
                  "DELIVERY" \
                  "VERIFY_PACKAGE" \
                  2 \
                  "package.json found in build artifact." \
                  "VERIFY_PACKAGE: package.json"
          else
              post_fail \
                  "DELIVERY" \
                  "VERIFY_PACKAGE" \
                  0 \
                  "package.json not found in build artifact." \
                  ""
              post_terminate_delivery
          fi

          post_result \
              "DELIVERY" \
              "VERIFY_BUILD_ARTIFACT" \
              "PASSED" \
              0 \
              "Build artifact validation complete (${SCORE}/10)."

      ###############################################################################
      # Verify Dockerfile
      ###############################################################################

      - name: Verify Dockerfile

        shell: bash

        run: |
          
          source .github/actions/common/report.sh

          TECH=$(echo "${{ inputs.technology }}" | tr '[:upper:]' '[:lower:]')
          case "$TECH" in
            springboot|spring-boot) TECH=spring ;;
            golang) TECH=go ;;
            rubyonrails) TECH=rails ;;
            apollographql) TECH=apollo ;;
          esac

          DOCKERFILE="Dockerfile"
          if [ "$TECH" = "django" ]; then
            DOCKERFILE="${APP_NAME}/Dockerfile"
          fi
          
          if [ -f "${DOCKERFILE}" ]; then
          
              post_pass \
                  "DELIVERY" \
                  "VERIFY_DOCKERFILE" \
                  5 \
                  "Dockerfile located." \
                  "VERIFY_DOCKERFILE: ${DOCKERFILE} exists."
          
          else
          
              post_fail \
                  "DELIVERY" \
                  "VERIFY_DOCKERFILE" \
                  0 \
                  "Dockerfile not found." \
                  "VERIFY_DOCKERFILE: Unable to locate ${DOCKERFILE}."
          
              post_terminate_delivery
          
          fi

      ###############################################################################
      # Setting up Docker
      ###############################################################################

      - name: Setting up Docker

        shell: bash

        run: |
          
          source .github/actions/common/report.sh
          
            post_pass \
                "DELIVERY" \
                "SETTING_UP_DOCKER" \
                0 \
                "Setting up Docker..." \
                ""

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      ###############################################################################
      # Docker login
      ###############################################################################
      - name: Logging into Docker

        shell: bash

        run: |
          
          source .github/actions/common/report.sh
          
            post_pass \
                "DELIVERY" \
                "DOCKER_LOGIN" \
                0 \
                "Logging into Docker..." \
                ""

      - name: Log in to Docker Hub
        id: docker_login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username:  ${{ inputs.dockerUsername }}
          password:  ${{ inputs.dockerPassword }}

      ###############################################################################
      # Report Docker login
      ###############################################################################

      - name: Report Docker Login

        shell: bash

        run: |

          source .github/actions/common/report.sh

          if [ "${{ steps.docker_login.outcome }}" = "success" ]; then

              post_pass \
                  "DELIVERY" \
                  "DOCKER_LOGIN" \
                  10 \
                  "Successfully authenticated with Docker registry." \
                  ""

          else

              post_fail \
                  "DELIVERY" \
                  "DOCKER_LOGIN" \
                  0 \
                  "Unable to authenticate with Docker registry." \
                  "Verify the registry URL, username and password."

              post_terminate_delivery

          fi

      ###############################################################################
      # Normalize Dockerfile for Go root-layout samples (before docker build)
      ###############################################################################

      - name: Prepare Go Dockerfile If Needed
        if: ${{ contains(fromJSON('["go","golang"]'), inputs.technology) }}

        shell: bash

        run: |
          source .github/actions/common/report.sh

          # HarborMaster Go samples may ship a broken Dockerfile (e.g. WORKDIR src/demo,
          # apt-get on alpine) while sources live at repo root with module path "demo/...".
          if [ -f main.go ] && { [ -d internal ] || [ -f go.mod ]; }; then
              if [ ! -d src/demo ] || grep -Eq 'apt-get|WORKDIR[[:space:]]+src/demo' Dockerfile 2>/dev/null; then
                  MODULE_NAME="app"
                  INFERRED=$(grep -RhoE '"[a-zA-Z0-9._-]+/internal/' --include='*.go' . 2>/dev/null | head -1 | sed -E 's/^"([^/]+)\/.*/\1/' || true)
                  if [ -n "${INFERRED}" ]; then
                      MODULE_NAME="${INFERRED}"
                  fi
                  echo "Writing verification Dockerfile for Go root-layout application (module ${MODULE_NAME})..."
                  cat > Dockerfile <<EOF
          FROM golang:1.22-alpine AS builder
          WORKDIR /app
          RUN apk add --no-cache git
          COPY . .
          RUN if [ ! -f go.mod ]; then go mod init ${MODULE_NAME}; fi \\
           && go mod tidy \\
           && CGO_ENABLED=0 GOOS=linux go build -o /out/app .
          FROM alpine:3.20
          WORKDIR /app
          RUN apk add --no-cache ca-certificates \\
           && printf '%s\\n' \\
                'APP_PORT=8080' \\
                'DB_USER_NAME=root' \\
                'DB_PASSWORD=root' \\
                'DB_NAME=harbormaster' \\
                'DB_HOST=127.0.0.1' \\
                'DB_PORT=3306' \\
                'DB_TYPE=mysql' \\
                'DB_ARGS=charset=utf8&parseTime=True&loc=Local' \\
                'DB_DISABLE_FK_CONSTRAINTS=true' \\
                > .env
          COPY --from=builder /out/app /app/app
          EXPOSE 8080
          CMD ["/app/app"]
          EOF
                  sed -i 's/^          //' Dockerfile
              fi
          fi

          post_pass \
              "DELIVERY" \
              "PREPARE_DOCKERFILE" \
              0 \
              "Dockerfile ready for image build." \
              ""

      ###############################################################################
      # Docker Build
      ###############################################################################

      - name: Build Docker Image

        shell: bash

        run: |
          
          source .github/actions/common/report.sh

          TECH=$(echo "${{ inputs.technology }}" | tr '[:upper:]' '[:lower:]')
          case "$TECH" in
            springboot|spring-boot) TECH=spring ;;
            golang) TECH=go ;;
            rubyonrails) TECH=rails ;;
            apollographql) TECH=apollo ;;
          esac

          BUILD_CONTEXT="."
          if [ "$TECH" = "django" ]; then
            BUILD_CONTEXT="${APP_NAME}"
          fi
                             
          echo "Running docker build (context=${BUILD_CONTEXT})..."
                    
          if docker build --progress=plain -t "${{ inputs.dockerOrg }}/${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}" "${BUILD_CONTEXT}"; then
          
              post_pass \
                  "DELIVERY" \
                  "DOCKER_BUILD" \
                  20 \
                  "Docker image built successfully." \
                  "DOCKER_BUILD: ${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}"
          
          else
          
              post_fail \
                  "DELIVERY" \
                  "DOCKER_BUILD" \
                  0 \
                  "Docker build failed." \
                  "DOCKER_BUILD: docker build failed for context ${BUILD_CONTEXT}"
          
              post_terminate_delivery
          
          fi


      ###############################################################################
      # Verify Docker Image
      ###############################################################################

      - name: Verify Docker Image

        shell: bash

        run: |
          
          source .github/actions/common/report.sh
          
          IMAGE=$(docker images -q "${{ inputs.dockerOrg }}/${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}")
          
          if [ -n "$IMAGE" ]; then
          
              post_pass \
                  "DELIVERY" \
                  "VERIFY_IMAGE" \
                  15 \
                  "Docker image verified." \
                  "VERIFY_IMAGE: ${IMAGE}"
          
          else
          
              post_fail \
                  "DELIVERY" \
                  "VERIFY_IMAGE" \
                  0 \
                  "Docker image missing." \
                  "VERIFY_IMAGE: Image not found."
          
              post_terminate_delivery
          
          fi

      ###############################################################################
      # Wait for MySQL
      ###############################################################################

      - name: Wait For MySQL
        if: ${{ contains(fromJSON('["spring","springboot","spring-boot","go","golang"]'), inputs.technology) }}

        shell: bash

        run: |
          source .github/actions/common/report.sh

          post_pass \
              "DELIVERY" \
              "WAITING_FOR_MYSQL" \
              0 \
              "Waiting for MySQL to start." \
              ""

          for i in {1..60}; do
              if bash -c "</dev/tcp/127.0.0.1/3306" >/dev/null 2>&1; then
                  post_pass \
                      "DELIVERY" \
                      "MYSQL_READY" \
                      0 \
                      "MySQL is ready." \
                      "MySQL service is accepting connections."
                  exit 0
              fi
              sleep 2
          done

          post_fail \
              "DELIVERY" \
              "MYSQL_READY" \
              0 \
              "MySQL failed to start." \
              "MySQL service did not become ready within 120 seconds."

          post_terminate_delivery

      ###############################################################################
      # Rails: Postgres sidecar (same behavior as rails-delivery-verification.yml)
      ###############################################################################

      - name: Start Postgres For Rails
        if: ${{ contains(fromJSON('["rails","rubyonrails"]'), inputs.technology) }}

        shell: bash

        run: |
          source .github/actions/common/report.sh

          docker network create harbormaster-verification >/dev/null 2>&1 || true

          docker run -d \
            --name harbormaster-postgres \
            --network harbormaster-verification \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=rails_test \
            postgres:17-alpine

          for i in {1..30}; do
            if docker exec harbormaster-postgres pg_isready -U postgres -d rails_test >/dev/null 2>&1; then
              post_pass \
                "DELIVERY" \
                "POSTGRES_READY" \
                0 \
                "Postgres is ready for Rails delivery." \
                ""
              exit 0
            fi
            sleep 2
          done

          docker logs harbormaster-postgres || true
          post_fail \
            "DELIVERY" \
            "POSTGRES_READY" \
            0 \
            "Postgres failed to start for Rails delivery." \
            ""
          post_terminate_delivery

      ###############################################################################
      # Run Container
      ###############################################################################

      - name: Run Docker Container

        shell: bash

        run: |
          
          source .github/actions/common/report.sh

          TECH=$(echo "${{ inputs.technology }}" | tr '[:upper:]' '[:lower:]')
          case "$TECH" in
            springboot|spring-boot) TECH=spring ;;
            golang) TECH=go ;;
            rubyonrails) TECH=rails ;;
            apollographql) TECH=apollo ;;
          esac

          IMAGE="${{ inputs.dockerOrg }}/${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}"
          RUN_OK=1

          case "$TECH" in
            spring|go)
              docker run -d --name ${APP_NAME} -p 8080:8080 \
                --add-host=host.docker.internal:host-gateway \
                -e SERVER_PORT=8080 \
                -e APP_PORT=8080 \
                -e SPRING_DATASOURCE_URL='jdbc:mysql://host.docker.internal:3306/harbormaster' \
                -e SPRING_DATASOURCE_USERNAME=root \
                -e SPRING_DATASOURCE_PASSWORD=root \
                -e SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver \
                -e SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQL8Dialect \
                -e DB_USER_NAME=root \
                -e DB_PASSWORD=root \
                -e DB_NAME=harbormaster \
                -e DB_HOST=host.docker.internal \
                -e DB_PORT=3306 \
                -e DB_TYPE=mysql \
                -e DB_ARGS='charset=utf8&parseTime=True&loc=Local' \
                -e DB_DISABLE_FK_CONSTRAINTS=true \
                "${IMAGE}" || RUN_OK=0
              ;;
            angular)
              docker run -d --name ${APP_NAME} -p 8080:80 "${IMAGE}" || RUN_OK=0
              ;;
            django)
              docker run -d --name ${APP_NAME} -p 8080:8000 "${IMAGE}" || RUN_OK=0
              ;;
            rails)
              docker run -d --name ${APP_NAME} \
                --network harbormaster-verification \
                -e RAILS_ENV=harbormaster_test \
                -e PGHOST=harbormaster-postgres \
                -e PGPORT=5432 \
                -e PGUSER=postgres \
                -e PGPASSWORD=postgres \
                -e PGDATABASE=rails_test \
                -e SECRET_KEY_BASE="$(ruby -rsecurerandom -e 'puts SecureRandom.hex(64)')" \
                -p 8080:3000 \
                "${IMAGE}" || RUN_OK=0
              ;;
            apollo)
              docker run -d --name ${APP_NAME} -p 4000:4000 "${IMAGE}" || RUN_OK=0
              ;;
            *)
              echo "Unsupported technology for delivery: ${TECH}"
              RUN_OK=0
              ;;
          esac
          
          if [ "$RUN_OK" -eq 1 ]; then
          
              post_pass \
                  "DELIVERY" \
                  "RUN_CONTAINER" \
                  20 \
                  "Container ${APP_NAME} started." \
                  "RUN_CONTAINER: ${APP_NAME} (${TECH})"
          
          else
          
              post_fail \
                  "DELIVERY" \
                  "RUN_CONTAINER" \
                  0 \
                  "Unable to start container ${APP_NAME}." \
                  "RUN_CONTAINER: docker run failed on ${APP_NAME} (${TECH})."
          
              post_terminate_delivery
          
          fi

      ###############################################################################
      # Verify Container
      ###############################################################################

      - name: Verify Container Health

        shell: bash

        run: |
          
          source .github/actions/common/report.sh

          TECH=$(echo "${{ inputs.technology }}" | tr '[:upper:]' '[:lower:]')
          case "$TECH" in
            springboot|spring-boot) TECH=spring ;;
            golang) TECH=go ;;
            rubyonrails) TECH=rails ;;
            apollographql) TECH=apollo ;;
          esac

          ATTEMPTS=30
          if [ "$TECH" = "spring" ] || [ "$TECH" = "go" ]; then
            ATTEMPTS=90
          fi

          for i in $(seq 1 "${ATTEMPTS}"); do
              HEALTHY=0
              case "$TECH" in
                spring|go)
                  if curl -fs http://localhost:8080/actuator/health >/dev/null \
                     || curl -fs http://localhost:8080/health >/dev/null; then
                    HEALTHY=1
                  fi
                  ;;
                angular|django)
                  if curl -fs http://localhost:8080/ >/dev/null; then
                    HEALTHY=1
                  fi
                  ;;
                rails)
                  # Preserve previous Rails behavior: any HTTP response (not connection failure).
                  HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
                  if [ "${HTTP_STATUS}" != "000" ] && [ -n "${HTTP_STATUS}" ]; then
                    HEALTHY=1
                  fi
                  ;;
                apollo)
                  BODY=$(curl -s -X POST http://localhost:4000/ \
                    -H "Content-Type: application/json" \
                    -d '{"query":"{ health }"}' || true)
                  HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:4000/ \
                    -H "Content-Type: application/json" \
                    -d '{"query":"{ health }"}' || true)
                  if [ "${HTTP_STATUS}" = "200" ] \
                     && echo "${BODY}" | grep -q '"health"' \
                     && echo "${BODY}" | grep -qi 'OK'; then
                    HEALTHY=1
                  fi
                  ;;
              esac

              if [ "$HEALTHY" -eq 1 ]; then
                  post_pass \
                      "DELIVERY" \
                      "CONTAINER_HEALTH" \
                      15 \
                      "Container health check passed." \
                      "CONTAINER_HEALTH: ${TECH} application reported UP."
                  exit 0
              fi

              sleep 2
          done
          
          LOG=$(docker logs ${APP_NAME} 2>/dev/null | tail -20 | tr '\n' ' ')
          
          post_fail \
              "DELIVERY" \
              "CONTAINER_HEALTH" \
              0 \
              "Container failed health check." \
              "${LOG}"
          
          post_terminate_delivery


      ###########################################################################
      # Push Image
      ###########################################################################

      - name: Push Image

        shell: bash

        run: |
          
          source .github/actions/common/report.sh

          if docker push ${{ inputs.dockerOrg }}/${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}; then
          
            post_pass \
              "DELIVERY" \
              "PUBLISH_IMAGE" \
              15 \
              "Docker image published successfully." \
              "PUBLISH_IMAGE: ${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}"
    
          else
            
            post_fail \
              "DELIVERY" \
              "PUBLISH_IMAGE" \
              0 \
              "Docker image publication failed." \
              "PUBLISH_IMAGE: Unable to push ${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}"
        
              post_terminate_delivery
      
            fi


      ###########################################################################
      #   Store the image as an artifact
      ###########################################################################

      - name: Store Docker Image

        run: |
        
          if [ "${{ inputs.saveDockerImage }}" = "TRUE" ]; then
            docker save "${{ inputs.dockerOrg }}/${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}" -o "${APP_NAME}.tar"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.saveDockerImage == 'TRUE' }}

        with:

          name: docker-image

          path: ${{ env.APP_NAME }}.tar

          if-no-files-found: ignore

      ###############################################################################
      # Cleanup
      ###############################################################################

      - name: Cleanup

        if: always()

        shell: bash

        run: |
          
          source .github/actions/common/report.sh

          docker stop ${APP_NAME} >/dev/null 2>&1 || true
          docker rm ${APP_NAME} >/dev/null 2>&1 || true

          # Rails sidecar cleanup (no-op for other stacks)
          docker stop harbormaster-postgres >/dev/null 2>&1 || true
          docker rm harbormaster-postgres >/dev/null 2>&1 || true
          docker network rm harbormaster-verification >/dev/null 2>&1 || true

          docker logout ${{ inputs.dockerHost }} >/dev/null 2>&1 || true
          
          post_pass \
              "DELIVERY" \
              "CLEANUP" \
              0 \
              "Container stopped and removed locally." \
              "CLEANUP: Docker resources cleaned up."


      ###############################################################################
      # Delete verification branch:
      # - Spring/Go: only when deployToCloud is false (cloud may need the branch)
      # - Other stacks: always (previous per-tech delivery behavior)
      ###############################################################################

      - name: Delete Verification Branch
        if: ${{ always() && (inputs.deployToCloud == false || !contains(fromJSON('["spring","springboot","spring-boot","go","golang"]'), inputs.technology)) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.branch }}" ] && [ -n "${{ inputs.gitHubToken }}" ]; then
            curl -L \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ inputs.gitHubToken }}" \
              https://api.github.com/repos/${{ github.repository }}/git/refs/heads/${{ inputs.branch }}
          fi

      ###############################################################################
      # Terminate Verification
      ###############################################################################

      - name: Terminate Verification
        if: always()
        shell: bash

        run: |
          source .github/actions/common/report.sh
          
          post_terminate_delivery false
