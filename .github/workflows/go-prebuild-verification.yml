name: Go Pre-Build Verification

on:

  workflow_call:

    inputs:

      runner:
        description: GitHub runner
        required: false
        default: self-hosted
        type: string

      resultUrl:
        description: URL to post certification progress
        required: false
        default: "http://localhost:3000"
        type: string

      actionToCall:
        description: action to call when posting to URL
        required: true
        default: "updateSystemVerificationProgress"
        type: string

      branch:
        description: Branch to checkout
        required: true
        default: ""
        type: string

      certificationIdentifier:
        description: Certification Identifier
        required: true
        type: string

      appName:
        description: Application Name
        required: true
        type: string

      languageName:
        description: The core language of the system
        required: false
        default: "Go"
        type: string

      languageVersion:
        description: The core language version of the system
        required: true
        type: string


env:

  RESULT_URL: ${{ inputs.resultUrl }}
  ACTION_TO_CALL: ${{ inputs.actionToCall }}
  CERTIFICATION_IDENTIFIER: ${{ inputs.certificationIdentifier }}
  APP_NAME: ${{ inputs.appName }}


jobs:

  pre-build-verification:

    runs-on: ${{ inputs.runner }}

    steps:

      ###########################################################################
      # Checkout Source
      ###########################################################################

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || github.ref_name }}

      ###########################################################################
      # Always use report.sh from the verification workflow commit
      ###########################################################################

      - name: Overlay verification report.sh
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .hm-verification-overlay
          sparse-checkout: |
            .github/actions/common
          sparse-checkout-cone-mode: false

      - name: Install verification report.sh
        shell: bash
        run: |
          mkdir -p .github/actions/common
          cp -f \
            .hm-verification-overlay/.github/actions/common/report.sh \
            .github/actions/common/report.sh
          chmod +x .github/actions/common/report.sh

      ###########################################################################
      # Verify Checkout
      ###########################################################################

      - name: Verify Checkout
        shell: bash
        run: |

          source .github/actions/common/report.sh

          if [ -d ".git" ]; then

            post_pass \
              "PRE_BUILD" \
              "CHECKOUT_SOURCE" \
              0 \
              "Repository checked out successfully."

          else

            post_fail \
              "PRE_BUILD" \
              "CHECKOUT_SOURCE" \
              0 \
              "Repository checkout failed."

            post_terminate_build

          fi

      ###########################################################################
      # Determine Go Application Directory
      ###########################################################################

      - name: Determine Go Application Directory
        shell: bash
        run: |

          source .github/actions/common/report.sh

          if [ -d "${APP_NAME}" ] && {
              [ -f "${APP_NAME}/go.mod" ] ||
              [ -f "${APP_NAME}/main.go" ] ||
              [ -d "${APP_NAME}/internal" ];
          }; then

            APP_DIR="${APP_NAME}"

          elif [ -f "go.mod" ] ||
               [ -f "main.go" ] ||
               [ -d "internal" ]; then

            APP_DIR="."

          else

            post_fail \
              "PRE_BUILD" \
              "GO_APPLICATION" \
              0 \
              "Could not locate Go application sources." \
              "Expected ./${APP_NAME} or Go sources at repository root."

            post_terminate_build

          fi

          echo "APP_DIR=${APP_DIR}" >> "$GITHUB_ENV"

          echo "Resolved APP_DIR=${APP_DIR}"

      ###########################################################################
      # Determine Go Version
      ###########################################################################

      - name: Determine Go Version
        shell: bash
        run: |

          source .github/actions/common/report.sh

          GO_VERSION="${{ inputs.languageVersion }}"

          if [ -f "${APP_DIR}/go.mod" ]; then

            PARSED_VERSION=$(
              grep -E '^go [0-9]+\.[0-9]+(\.[0-9]+)?' \
                "${APP_DIR}/go.mod" |
              head -1 |
              awk '{print $2}'
            )

            if [ -n "${PARSED_VERSION}" ]; then
              GO_VERSION="${PARSED_VERSION}"
            fi

          fi

          echo "GO_VERSION=${GO_VERSION}" >> "$GITHUB_ENV"

          echo "Using Go ${GO_VERSION}"

      ###########################################################################
      # Setup Go
      ###########################################################################

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false


      ###########################################################################
      # Format Code
      ###########################################################################

      - name: Format Code
        shell: bash
        run: |
        
          source .github/actions/common/report.sh
          
          cd "${APP_DIR}"
          
          echo "Running gofmt..."
          
          while IFS= read -r -d '' file; do
        
            echo "Formatting: ${file}"
        
            FIRST_HASH=$(sha256sum "${file}" | awk '{print $1}')
        
            gofmt -w "${file}"
          
            SECOND_HASH=$(sha256sum "${file}" | awk '{print $1}')
          
            gofmt -w "${file}"
          
            THIRD_HASH=$(sha256sum "${file}" | awk '{print $1}')
          
            if [ "${SECOND_HASH}" != "${THIRD_HASH}" ]; then
          
                echo "gofmt is not stable for: ${file}"
              
              gofmt -d "${file}"
            
              post_fail \
                "PRE_BUILD" \
                "FORMAT_CODE" \
                0 \
                "gofmt is not stable for file." \
                "${file}"
            
              post_terminate_build
          
            fi
          
          done < <(find . -type f -name '*.go' -print0)
          
          post_pass \
            "PRE_BUILD" \
            "FORMAT_CODE" \
            15 \
            "Go source formatting completed successfully." \
            "All Go source files are gofmt compliant."

      ###########################################################################
      # Commit Files
      ###########################################################################

      - name: Commit Files
        shell: bash
        run: |

          source .github/actions/common/report.sh

          echo "Checking for generated changes..."

          git status --short

          if [ -z "$(git status --porcelain)" ]; then

            post_pass \
              "PRE_BUILD" \
              "COMMIT_FILES" \
              0 \
              "No file changes require committing." \
              "Working tree is clean."

            exit 0

          fi

          echo "Changes detected:"

          git status --short

          #######################################################################
          # Configure commit identity
          #######################################################################

          git config user.name "HarborMaster Verification"
          git config user.email "verification@harbormaster.io"

          #######################################################################
          # Commit formatting changes
          #######################################################################

          git add -A

          if git commit -m "chore: format generated Go source"; then

            post_pass \
              "PRE_BUILD" \
              "COMMIT_FILES" \
              0 \
              "Generated source changes committed." \
              "Formatting and verification changes committed."

          else

            post_fail \
              "PRE_BUILD" \
              "COMMIT_FILES" \
              0 \
              "Failed to commit generated source changes."

            post_terminate_build

          fi

          #######################################################################
          # Push changes back to the source branch
          #######################################################################

          TARGET_BRANCH="${{ inputs.branch }}"

          if [ -z "${TARGET_BRANCH}" ]; then
            TARGET_BRANCH="${GITHUB_REF_NAME}"
          fi

          echo "Pushing changes to ${TARGET_BRANCH}"

          if git push origin "HEAD:${TARGET_BRANCH}"; then

            post_pass \
              "PRE_BUILD" \
              "COMMIT_FILES" \
              0 \
              "Generated source changes pushed successfully." \
              "Committed changes pushed to ${TARGET_BRANCH}."

          else

            post_fail \
              "PRE_BUILD" \
              "COMMIT_FILES" \
              0 \
              "Failed to push generated source changes." \
              "GitHub rejected the push to ${TARGET_BRANCH}."

            post_terminate_build

          fi

      ###########################################################################
      # Static Analysis
      ###########################################################################

      - name: Static Analysis
        shell: bash
        run: |

          source .github/actions/common/report.sh

          cd "${APP_DIR}"

          if [ ! -f go.mod ]; then
            echo "go.mod not found. Initializing Go module..."
          
            # Module path for go mod init. Root layouts often import "demo/..." etc.
            MODULE_NAME="${APP_NAME}"
          
            if [ "${APP_DIR}" = "." ]; then
              INFERRED=$(grep -RhoE '"[a-zA-Z0-9._-]+/internal/' --include='*.go' . 2>/dev/null | head -1 | sed -E 's/^"([^/]+)\/.*/\1/' || true)
              if [ -n "${INFERRED}" ]; then
                  MODULE_NAME="${INFERRED}"
              fi
            fi
            
            go mod init "${MODULE_NAME}"
            go mod tidy
            go list -m all | grep -E 'gorm.io/gorm|golang.org/x/text'
            go mod why -m golang.org/x/text
            go mod why -m gorm.io/driver/sqlite
            go mod graph | grep 'golang.org/x/text'
          
          
          fi
  
          echo "Running go vet..."

          if ! go vet ./... > go-vet.log 2>&1; then

            cat go-vet.log

            MESSAGE=$(tail -30 go-vet.log | tr '\n' ' ')

            post_fail \
              "PRE_BUILD" \
              "GO_VET" \
              0 \
              "go vet failed." \
              "${MESSAGE}"

            post_terminate_build

          fi

          post_pass \
            "PRE_BUILD" \
            "GO_VET" \
            10 \
            "go vet completed successfully."

          echo "Installing staticcheck..."

          go install honnef.co/go/tools/cmd/staticcheck@latest

          echo "Running staticcheck..."

          if ! staticcheck ./... > staticcheck.log 2>&1; then

            cat staticcheck.log

            MESSAGE=$(tail -30 staticcheck.log | tr '\n' ' ')

            post_fail \
              "PRE_BUILD" \
              "STATICCHECK" \
              0 \
              "staticcheck failed." \
              "${MESSAGE}"

            post_terminate_build

          fi

          post_pass \
            "PRE_BUILD" \
            "STATICCHECK" \
            10 \
            "staticcheck completed successfully."

      ###########################################################################
      # Security Check
      ###########################################################################

      - name: Security Check
        shell: bash
        run: |

          source .github/actions/common/report.sh

          cd "${APP_DIR}"

          #######################################################################
          # Vulnerability scanning
          #######################################################################

          echo "Installing govulncheck..."

          go install golang.org/x/vuln/cmd/govulncheck@latest

          echo "Running govulncheck..."

          if ! govulncheck ./... > govulncheck.log 2>&1; then

            cat govulncheck.log

            MESSAGE=$(tail -30 govulncheck.log | tr '\n' ' ')

            post_fail \
              "PRE_BUILD" \
              "GO_VULNCHECK" \
              0 \
              "Go vulnerability check failed." \
              "${MESSAGE}"

            post_terminate_build

          fi

          post_pass \
            "PRE_BUILD" \
            "GO_VULNCHECK" \
            5 \
            "Go vulnerability check completed successfully."

          #######################################################################
          # Source security analysis
          #######################################################################

          echo "Installing gosec..."

          go install github.com/securego/gosec/v2/cmd/gosec@latest

          echo "Running gosec..."

          if ! gosec ./... > gosec.log 2>&1; then

            cat gosec.log

            MESSAGE=$(tail -30 gosec.log | tr '\n' ' ')

            post_fail \
              "PRE_BUILD" \
              "GOSEC" \
              0 \
              "gosec security analysis failed." \
              "${MESSAGE}"

            post_terminate_build

          fi

          post_pass \
            "PRE_BUILD" \
            "GOSEC" \
            5 \
            "gosec security analysis completed successfully."

      ###########################################################################
      # Terminate Verification
      ###########################################################################

      - name: Terminate Verification
        shell: bash
        run: |

          source .github/actions/common/report.sh

          post_terminate_build false